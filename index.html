<!DOCTYPE html>
<html lang="fa" dir="rtl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Medicall | پرونده بیماران</title>

<style>
*{
    box-sizing:border-box;
    font-family:Tahoma,Arial,sans-serif;
}

body{
    margin:0;
    background:#f1f7fb;
    color:#183b56;
}

#loginPage{
    min-height:100vh;
    display:flex;
    justify-content:center;
    align-items:center;
    padding:20px;
    background:linear-gradient(135deg,#087f8c,#1b4965);
}

.login-card{
    width:100%;
    max-width:400px;
    background:white;
    border-radius:24px;
    padding:30px;
    box-shadow:0 15px 40px rgba(0,0,0,.2);
    text-align:center;
}

.medical-logo{
    width:90px;
    height:90px;
    margin:auto;
    border-radius:50%;
    background:#e8f8fa;
    display:flex;
    justify-content:center;
    align-items:center;
    font-size:48px;
}

.login-card h1{
    margin:15px 0 5px;
}

.login-card p{
    color:#667788;
}

input,
textarea,
select{
    width:100%;
    padding:13px;
    margin:7px 0;
    border:1px solid #ccdce5;
    border-radius:12px;
    font-size:15px;
    outline:none;
}

input:focus,
textarea:focus,
select:focus{
    border-color:#087f8c;
}

textarea{
    min-height:100px;
    resize:vertical;
}

button{
    border:0;
    border-radius:12px;
    padding:13px 18px;
    cursor:pointer;
    font-size:15px;
}

.login-button{
    width:100%;
    margin-top:10px;
    background:#087f8c;
    color:white;
}

.login-button:active,
.primary:active,
.danger:active,
.secondary:active{
    transform:scale(.98);
}

#mainPage{
    display:none;
    padding:20px;
    max-width:1000px;
    margin:auto;
}

.header{
    background:white;
    padding:20px;
    border-radius:18px;
    margin-bottom:20px;
    box-shadow:0 5px 20px rgba(0,0,0,.07);
}

.header h1{
    margin:0 0 5px;
}

.card{
    background:white;
    padding:20px;
    border-radius:18px;
    margin-bottom:20px;
    box-shadow:0 5px 20px rgba(0,0,0,.07);
}

.grid{
    display:grid;
    grid-template-columns:repeat(auto-fit,minmax(220px,1fr));
    gap:10px;
}

.primary{
    background:#087f8c;
    color:white;
}

.danger{
    background:#d9534f;
    color:white;
}

.secondary{
    background:#e8f1f5;
    color:#183b56;
}

.patient{
    border:1px solid #dce8ee;
    border-radius:15px;
    padding:15px;
    margin-top:10px;
}

.patient h3{
    margin-top:0;
}

.actions{
    display:flex;
    gap:8px;
    flex-wrap:wrap;
    margin-top:10px;
}

.message{
    min-height:20px;
}

.success{
    color:#087f8c !important;
}

.error{
    color:#d9534f !important;
}

.empty{
    text-align:center;
    color:#71808c;
    padding:15px;
}

.backup-note{
    color:#667788;
    line-height:1.8;
}

@media(max-width:600px){
    #mainPage{
        padding:12px;
    }

    .card{
        padding:15px;
    }

    .login-card{
        padding:24px;
    }
}
</style>
</head>

<body>

<!-- ================= LOGIN ================= -->

<div id="loginPage">

    <div class="login-card">

        <div class="medical-logo">⚕️</div>

        <h1>Medicall</h1>

        <p>
            سیستم مدیریت پرونده بیماران
        </p>

        <input
            id="username"
            type="text"
            placeholder="نام کاربری"
            autocomplete="username"
        >

        <input
            id="password"
            type="password"
            placeholder="رمز عبور"
            autocomplete="current-password"
        >

        <button
            type="button"
            class="login-button"
            id="loginButton"
        >
            ورود به سیستم
        </button>

        <p
            id="loginMessage"
            class="message"
        ></p>

    </div>

</div>


<!-- ================= MAIN ================= -->

<div id="mainPage">

    <div class="header">

        <h1>
            ⚕️ پرونده بیماران
        </h1>

        <p>
            مدیریت اطلاعات بیماران
        </p>

        <button
            type="button"
            class="danger"
            id="logoutButton"
        >
            خروج
        </button>

    </div>


    <!-- ================= ADD PATIENT ================= -->

    <div class="card">

        <h2>
            ➕ ثبت بیمار جدید
        </h2>

        <div class="grid">

            <input
                id="name"
                type="text"
                placeholder="نام و نام خانوادگی"
            >

            <input
                id="nationalCode"
                type="text"
                inputmode="numeric"
                placeholder="کد ملی"
            >

            <input
                id="fatherName"
                type="text"
                placeholder="نام پدر"
            >

            <input
                id="phone"
                type="tel"
                placeholder="شماره تماس"
            >

            <select id="mainInsurance">

                <option value="">
                    نوع بیمه اصلی
                </option>

                <option value="تأمین اجتماعی">
                    تأمین اجتماعی
                </option>

                <option value="سلامت">
                    سلامت
                </option>

                <option value="نیروهای مسلح">
                    نیروهای مسلح
                </option>

                <option value="آزاد">
                    آزاد
                </option>

                <option value="سایر">
                    سایر
                </option>

            </select>

            <input
                id="supplementaryInsurance"
                type="text"
                placeholder="بیمه تکمیلی"
            >

            <input
                id="supplementaryNumber"
                type="text"
                placeholder="شماره بیمه تکمیلی"
            >

        </div>

        <textarea
            id="address"
            placeholder="آدرس"
        ></textarea>

        <button
            type="button"
            class="primary"
            id="saveButton"
        >
            ذخیره بیمار
        </button>

        <button
            type="button"
            class="secondary"
            id="clearButton"
        >
            پاک کردن
        </button>

        <p
            id="formMessage"
            class="message"
        ></p>

    </div>


    <!-- ================= SEARCH ================= -->

    <div class="card">

        <h2>
            🔎 جستجوی بیمار
        </h2>

        <input
            id="search"
            type="search"
            placeholder="نام، کد ملی یا شماره تماس..."
        >

        <div id="patientsList"></div>

    </div>


    <!-- ================= BACKUP ================= -->

    <div class="card">

        <h2>
            💾 پشتیبان اطلاعات
        </h2>

        <p class="backup-note">
            برای انتقال اطلاعات بیماران به کامپیوتر،
            ابتدا از اطلاعات خود فایل پشتیبان بگیرید.
        </p>

        <button
            type="button"
            class="primary"
            id="exportButton"
        >
            دریافت فایل پشتیبان
        </button>

        <input
            type="file"
            id="importFile"
            accept=".json,application/json"
        >

    </div>

</div>


<!-- ================= JAVASCRIPT ================= -->

<script>

"use strict";


/* ================= STORAGE ================= */

const STORAGE_KEY = "medicall_patients";


function loadPatients(){

    try{

        const saved =
            localStorage.getItem(STORAGE_KEY);

        if(!saved){
            return [];
        }

        const parsed =
            JSON.parse(saved);

        return Array.isArray(parsed)
            ? parsed
            : [];

    }catch(error){

        console.error(
            "Storage error:",
            error
        );

        return [];
    }
}


let patients = loadPatients();

let editingId = null;


/* ================= ELEMENTS ================= */

const loginPage =
    document.getElementById("loginPage");

const mainPage =
    document.getElementById("mainPage");

const usernameInput =
    document.getElementById("username");

const passwordInput =
    document.getElementById("password");

const loginButton =
    document.getElementById("loginButton");

const loginMessage =
    document.getElementById("loginMessage");

const logoutButton =
    document.getElementById("logoutButton");

const nameInput =
    document.getElementById("name");

const nationalCodeInput =
    document.getElementById("nationalCode");

const fatherNameInput =
    document.getElementById("fatherName");

const addressInput =
    document.getElementById("address");

const mainInsuranceInput =
    document.getElementById("mainInsurance");

const supplementaryInsuranceInput =
    document.getElementById(
        "supplementaryInsurance"
    );

const supplementaryNumberInput =
    document.getElementById(
        "supplementaryNumber"
    );

const phoneInput =
    document.getElementById("phone");

const saveButton =
    document.getElementById("saveButton");

const clearButton =
    document.getElementById("clearButton");

const formMessage =
    document.getElementById("formMessage");

const searchInput =
    document.getElementById("search");

const patientsList =
    document.getElementById("patientsList");

const exportButton =
    document.getElementById("exportButton");

const importFile =
    document.getElementById("importFile");


/* ================= LOGIN ================= */

function login(){

    const username =
        usernameInput.value.trim();

    const password =
        passwordInput.value;

    loginMessage.textContent = "";
    loginMessage.className =
        "message";


    if(
        username === "drsadeghian" &&
        password === "586768"
    ){

        loginPage.style.display =
            "none";

        mainPage.style.display =
            "block";

        loginMessage.textContent =
            "";

        showPatients();

    }else{

        loginMessage.textContent =
            "نام کاربری یا رمز عبور اشتباه است.";

        loginMessage.className =
            "message error";

    }
}


/* LOGIN BUTTON */

loginButton.addEventListener(
    "click",
    login
);


/* ENTER KEY */

passwordInput.addEventListener(
    "keydown",
    function(event){

        if(event.key === "Enter"){

            event.preventDefault();

            login();

        }

    }
);


/* ================= LOGOUT ================= */

function logout(){

    mainPage.style.display =
        "none";

    loginPage.style.display =
        "flex";

    usernameInput.value =
        "";

    passwordInput.value =
        "";

    loginMessage.textContent =
        "";

    loginMessage.className =
        "message";

}


logoutButton.addEventListener(
    "click",
    logout
);


/* ================= SAVE STORAGE ================= */

function saveToStorage(){

    try{

        localStorage.setItem(
            STORAGE_KEY,
            JSON.stringify(patients)
        );

        return true;

    }catch(error){

        console.error(
            "Save error:",
            error
        );

        alert(
            "ذخیره اطلاعات انجام نشد."
        );

        return false;
    }
}


/* ================= SAVE PATIENT ================= */

function savePatient(){

    const name =
        nameInput.value.trim();

    if(!name){

        formMessage.textContent =
            "لطفاً نام و نام خانوادگی را وارد کنید.";

        formMessage.className =
            "message error";

        nameInput.focus();

        return;
    }


    const patientData = {

        name:
            name,

        nationalCode:
            nationalCodeInput.value.trim(),

        fatherName:
            fatherNameInput.value.trim(),

        address:
            addressInput.value.trim(),

        mainInsurance:
            mainInsuranceInput.value,

        supplementaryInsurance:
            supplementaryInsuranceInput.value.trim(),

        supplementaryNumber:
            supplementaryNumberInput.value.trim(),

        phone:
            phoneInput.value.trim()

    };


    if(editingId !== null){

        const index =
            patients.findIndex(
                patient =>
                    patient.id === editingId
            );


        if(index !== -1){

            patients[index] = {

                ...patients[index],

                ...patientData

            };

            formMessage.textContent =
                "اطلاعات بیمار ویرایش شد.";

        }

        editingId = null;


    }else{

        const newPatient = {

            id:
                Date.now(),

            ...patientData

        };


        patients.push(
            newPatient
        );


        formMessage.textContent =
            "بیمار با موفقیت ثبت شد.";

    }


    formMessage.className =
        "message success";


    if(saveToStorage()){

        clearForm(false);

        showPatients();

    }

}


/* SAVE BUTTON */

saveButton.addEventListener(
    "click",
    savePatient
);


/* ================= CLEAR FORM ================= */

function clearForm(showMessage = true){

    nameInput.value =
        "";

    nationalCodeInput.value =
        "";

    fatherNameInput.value =
        "";

    addressInput.value =
        "";

    mainInsuranceInput.value =
        "";

    supplementaryInsuranceInput.value =
        "";

    supplementaryNumberInput.value =
        "";

    phoneInput.value =
        "";

    editingId =
        null;


    if(showMessage){

        formMessage.textContent =
            "فرم پاک شد.";

        formMessage.className =
            "message success";

    }

}


/* CLEAR BUTTON */

clearButton.addEventListener(
    "click",
    function(){

        clearForm(true);

    }
);


/* ================= SEARCH ================= */

searchInput.addEventListener(
    "input",
    showPatients
);


/* ================= SHOW PATIENTS ================= */

function showPatients(){

    const search =
        searchInput.value
            .trim()
            .toLowerCase();


    const filtered =
        patients.filter(
            patient => {

                const name =
                    String(
                        patient.name || ""
                    ).toLowerCase();

                const nationalCode =
                    String(
                        patient.nationalCode || ""
                    ).toLowerCase();

                const phone =
                    String(
                        patient.phone || ""
                    ).toLowerCase();


                return (

                    name.includes(search)

                    ||

                    nationalCode.includes(search)

                    ||

                    phone.includes(search)

                );

            }
        );


    if(filtered.length === 0){

        patientsList.innerHTML =
            '<div class="empty">هنوز بیماری ثبت نشده است.</div>';

        return;
    }


    patientsList.innerHTML =
        filtered
            .map(
                patient => `

                <div class="patient">

                    <h3>
                        👤
                        ${escapeHTML(
                            patient.name || "-"
                        )}
                    </h3>

                    <p>
                        <b>کد ملی:</b>
                        ${escapeHTML(
                            patient.nationalCode || "-"
                        )}
                    </p>

                    <p>
                        <b>نام پدر:</b>
                        ${escapeHTML(
                            patient.fatherName || "-"
                        )}
                    </p>

                    <p>
                        <b>شماره تماس:</b>
                        ${escapeHTML(
                            patient.phone || "-"
                        )}
                    </p>

                    <p>
                        <b>بیمه اصلی:</b>
                        ${escapeHTML(
                            patient.mainInsurance || "-"
                        )}
                    </p>

                    <p>
                        <b>بیمه تکمیلی:</b>
                        ${escapeHTML(
                            patient.supplementaryInsurance || "-"
                        )}
                    </p>

                    <div class="actions">

                        <button
                            type="button"
                            class="primary"
                            onclick="editPatient(${patient.id})"
                        >
                            ویرایش
                        </button>

                        <button
                            type="button"
                            class="danger"
                            onclick="deletePatient(${patient.id})"
                        >
                            حذف
                        </button>

                    </div>

                </div>

                `
            )
            .join("");

}


/* ================= EDIT ================= */

function editPatient(id){

    const patient =
        patients.find(
            item => item.id === id
        );


    if(!patient){
        return;
    }


    nameInput.value =
        patient.name || "";

    nationalCodeInput.value =
        patient.nationalCode || "";

    fatherNameInput.value =
        patient.fatherName || "";

    addressInput.value =
        patient.address || "";

    mainInsuranceInput.value =
        patient.mainInsurance || "";

    supplementaryInsuranceInput.value =
        patient.supplementaryInsurance || "";

    supplementaryNumberInput.value =
        patient.supplementaryNumber || "";

    phoneInput.value =
        patient.phone || "";


    editingId =
        id;


    formMessage.textContent =
        "در حال ویرایش اطلاعات بیمار هستید.";

    formMessage.className =
        "message";


    window.scrollTo({

        top:0,

        behavior:"smooth"

    });

}


/* ================= DELETE ================= */

function deletePatient(id){

    const patient =
        patients.find(
            item => item.id === id
        );


    if(!patient){
        return;
    }


    const confirmed =
        confirm(
            "آیا از حذف این بیمار مطمئن هستید؟"
        );


    if(!confirmed){
        return;
    }


    patients =
        patients.filter(
            item => item.id !== id
        );


    saveToStorage();

    showPatients();

}


/* ================= EXPORT ================= */

function exportData(){

    if(patients.length === 0){

        alert(
            "هنوز اطلاعاتی برای پشتیبان‌گیری وجود ندارد."
        );

        return;
    }


    const data =
        JSON.stringify(
            patients,
            null,
            2
        );


    const blob =
        new Blob(
            [data],
            {
                type:
                    "application/json"
            }
        );


    const url =
        URL.createObjectURL(blob);


    const link =
        document.createElement("a");


    const date =
        new Date()
            .toISOString()
            .slice(0,10);


    link.href =
        url;


    link.download =
        "Medicall-Backup-" +
        date +
        ".json";


    document.body.appendChild(
        link
    );


    link.click();


    document.body.removeChild(
        link
    );


    URL.revokeObjectURL(
        url
    );

}


/* EXPORT BUTTON */

exportButton.addEventListener(
    "click",
    exportData
);


/* ================= IMPORT ================= */

importFile.addEventListener(
    "change",
    importData
);


function importData(event){

    const file =
        event.target.files[0];


    if(!file){
        return;
    }


    const reader =
        new FileReader();


    reader.onload =
        function(){

            try{

                const imported =
                    JSON.parse(
                        reader.result
                    );


                if(
                    !Array.isArray(
                        imported
                    )
                ){

                    alert(
                        "فایل پشتیبان معتبر نیست."
                    );

                    return;
                }


                let added =
                    0;


                imported.forEach(
                    item => {

                        if(
                            !item ||
                            !item.id
                        ){

                            return;
                        }


                        const exists =
                            patients.some(
                                patient =>
                                    patient.id === item.id
                            );


                        if(!exists){

                            patients.push(
                                item
                            );

                            added++;

                        }

                    }
                );


                saveToStorage();

                showPatients();


                alert(
                    added +
                    " بیمار با موفقیت وارد شد."
                );


            }catch(error){

                console.error(
                    "Import error:",
                    error
                );


                alert(
                    "خواندن فایل پشتیبان با مشکل مواجه شد."
                );

            }


            importFile.value =
                "";

        };


    reader.readAsText(
        file
    );

}


/* ================= ESCAPE HTML ================= */

function escapeHTML(value){

    return String(value)

        .replace(
            /&/g,
            "&amp;"
        )

        .replace(
            /</g,
            "&lt;"
        )

        .replace(
            />/g,
            "&gt;"
        )

        .replace(
            /"/g,
            "&quot;"
        )

        .replace(
            /'/g,
            "&#039;"
        );

}


/* ================= START ================= */

showPatients();

</script>

</body>
</html>
