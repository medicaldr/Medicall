<!DOCTYPE html>
<html lang="fa" dir="rtl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Medicall</title>

<style>
body{
    font-family:Tahoma,Arial,sans-serif;
    background:#eef3f8;
    margin:0;
    padding:20px;
}
.box{
    max-width:700px;
    margin:30px auto;
    background:white;
    padding:25px;
    border-radius:16px;
    box-shadow:0 4px 15px rgba(0,0,0,.1);
}
h1,h2{text-align:center}
input,textarea,button{
    width:100%;
    box-sizing:border-box;
    padding:12px;
    margin:7px 0;
    border-radius:8px;
    border:1px solid #ccc;
    font-size:15px;
}
textarea{min-height:80px}
button{
    background:#2563eb;
    color:white;
    border:0;
    cursor:pointer;
}
.logout{background:#dc2626}
.patient{
    background:#f8fafc;
    border:1px solid #ddd;
    padding:15px;
    margin-top:15px;
    border-radius:10px;
}
.delete{background:#dc2626}
.error{
    color:red;
    text-align:center;
}
</style>
</head>

<body>

<!-- صفحه ورود -->
<div class="box" id="loginPage">

    <h1>🏥 Medicall</h1>
    <h2>ورود</h2>

    <input
        type="text"
        id="username"
        placeholder="نام کاربری">

    <input
        type="password"
        id="password"
        placeholder="رمز عبور">

    <button onclick="login()">ورود</button>

    <p id="loginError" class="error"></p>

</div>


<!-- برنامه اصلی -->
<div class="box" id="mainPage" style="display:none">

    <h1>🏥 پرونده پزشکی</h1>

    <button class="logout" onclick="logout()">
        خروج
    </button>

    <h2>ثبت بیمار</h2>

    <input id="name" placeholder="نام و نام خانوادگی">

    <input id="nationalCode" placeholder="کد ملی">

    <input id="fileNumber" placeholder="شماره پرونده">

    <input id="fatherName" placeholder="نام پدر">

    <textarea id="address" placeholder="آدرس"></textarea>

    <input id="insurance" placeholder="نوع بیمه اصلی">

    <input
        id="supplementaryInsurance"
        placeholder="بیمه تکمیلی">

    <input
        id="supplementaryInsuranceNumber"
        placeholder="شماره بیمه تکمیلی">

    <input id="phone" placeholder="شماره تماس">

    <button onclick="savePatient()">
        💾 ثبت بیمار
    </button>


    <h2>🔎 جستجوی بیمار</h2>

    <input
        id="search"
        placeholder="نام، کد ملی یا شماره پرونده..."
        oninput="searchPatients()">

    <div id="patients"></div>

</div>


<script>

const USERNAME = "admin";
const PASSWORD = "1234";

let patients =
    JSON.parse(localStorage.getItem("medicalPatients")) || [];


// ورود
function login(){

    const username =
        document.getElementById("username").value;

    const password =
        document.getElementById("password").value;

    if(username === USERNAME && password === PASSWORD){

        document.getElementById("loginPage").style.display =
            "none";

        document.getElementById("mainPage").style.display =
            "block";

        document.getElementById("loginError").innerText = "";

        displayPatients(patients);

    }else{

        document.getElementById("loginError").innerText =
            "نام کاربری یا رمز عبور اشتباه است.";

    }
}


// خروج
function logout(){

    document.getElementById("mainPage").style.display =
        "none";

    document.getElementById("loginPage").style.display =
        "block";

    document.getElementById("username").value = "";
    document.getElementById("password").value = "";

}


// ثبت بیمار
function savePatient(){

    const patient = {

        name:
            document.getElementById("name").value.trim(),

        nationalCode:
            document.getElementById("nationalCode").value.trim(),

        fileNumber:
            document.getElementById("fileNumber").value.trim(),

        fatherName:
            document.getElementById("fatherName").value.trim(),

        address:
            document.getElementById("address").value.trim(),

        insurance:
            document.getElementById("insurance").value.trim(),

        supplementaryInsurance:
            document.getElementById(
                "supplementaryInsurance"
            ).value.trim(),

        supplementaryInsuranceNumber:
            document.getElementById(
                "supplementaryInsuranceNumber"
            ).value.trim(),

        phone:
            document.getElementById("phone").value.trim()
    };


    if(!patient.name){

        alert("لطفاً نام بیمار را وارد کنید.");
        return;

    }


    patients.push(patient);

    localStorage.setItem(
        "medicalPatients",
        JSON.stringify(patients)
    );


    alert("بیمار با موفقیت ثبت شد ✅");

    clearForm();

    displayPatients(patients);
}


// پاک کردن فرم
function clearForm(){

    document.getElementById("name").value = "";
    document.getElementById("nationalCode").value = "";
    document.getElementById("fileNumber").value = "";
    document.getElementById("fatherName").value = "";
    document.getElementById("address").value = "";
    document.getElementById("insurance").value = "";
    document.getElementById("supplementaryInsurance").value = "";
    document.getElementById(
        "supplementaryInsuranceNumber"
    ).value = "";
    document.getElementById("phone").value = "";

}


// جستجو
function searchPatients(){

    const search =
        document.getElementById("search").value
        .trim()
        .toLowerCase();

    const filtered = patients.filter(patient =>

        patient.name.toLowerCase().includes(search) ||

        patient.nationalCode
            .toLowerCase()
            .includes(search) ||

        patient.fileNumber
            .toLowerCase()
            .includes(search)

    );

    displayPatients(filtered);

}


// نمایش بیماران
function displayPatients(list){

    const container =
        document.getElementById("patients");

    container.innerHTML = "";


    if(list.length === 0){

        container.innerHTML =
            "<p style='text-align:center'>بیماری پیدا نشد.</p>";

        return;

    }


    list.forEach((patient) => {

        const div =
            document.createElement("div");

        div.className = "patient";

        div.innerHTML = `

            <strong>👤 ${escapeHTML(patient.name)}</strong>

            <p>کد ملی:
            ${escapeHTML(patient.nationalCode)}</p>

            <p>شماره پرونده:
            ${escapeHTML(patient.fileNumber)}</p>

            <p>نام پدر:
            ${escapeHTML(patient.fatherName)}</p>

            <p>آدرس:
            ${escapeHTML(patient.address)}</p>

            <p>بیمه اصلی:
            ${escapeHTML(patient.insurance)}</p>

            <p>بیمه تکمیلی:
            ${escapeHTML(patient.supplementaryInsurance)}</p>

            <p>شماره بیمه تکمیلی:
            ${escapeHTML(
                patient.supplementaryInsuranceNumber
            )}</p>

            <p>شماره تماس:
            ${escapeHTML(patient.phone)}</p>

        `;

        container.appendChild(div);

    });

}


// جلوگیری از مشکل نمایش کدهای HTML
function escapeHTML(text){

    return String(text)
        .replace(/&/g,"&amp;")
        .replace(/</g,"&lt;")
        .replace(/>/g,"&gt;")
        .replace(/"/g,"&quot;")
        .replace(/'/g,"&#039;");

}

</script>

</body>
</html>
