<!DOCTYPE html>
<html lang="fa" dir="rtl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Medicall | پرونده بیماران</title>

<style>
*{
    box-sizing:border-box;
    font-family:Tahoma,Arial,sans-serif;
}

body{
    margin:0;
    background:#f1f7fb;
    color:#183b56;
}

#loginPage{
    min-height:100vh;
    display:flex;
    justify-content:center;
    align-items:center;
    padding:20px;
    background:linear-gradient(135deg,#087f8c,#1b4965);
}

.login-card{
    width:100%;
    max-width:400px;
    background:white;
    border-radius:24px;
    padding:30px;
    box-shadow:0 15px 40px rgba(0,0,0,.2);
    text-align:center;
}

.medical-logo{
    width:85px;
    height:85px;
    margin:auto;
    border-radius:50%;
    background:#e8f8fa;
    display:flex;
    justify-content:center;
    align-items:center;
    font-size:45px;
}

.login-card h1{
    margin:15px 0 5px;
}

.login-card p{
    color:#668;
}

input,textarea,select{
    width:100%;
    padding:13px;
    margin:7px 0;
    border:1px solid #ccdce5;
    border-radius:12px;
    font-size:15px;
}

button{
    border:0;
    border-radius:12px;
    padding:13px 18px;
    cursor:pointer;
    font-size:15px;
}

.login-button{
    width:100%;
    margin-top:10px;
    background:#087f8c;
    color:white;
}

#mainPage{
    display:none;
    padding:20px;
    max-width:1000px;
    margin:auto;
}

.header{
    background:white;
    padding:20px;
    border-radius:18px;
    margin-bottom:20px;
    box-shadow:0 5px 20px rgba(0,0,0,.07);
}

.header h1{
    margin:0 0 5px;
}

.card{
    background:white;
    padding:20px;
    border-radius:18px;
    margin-bottom:20px;
    box-shadow:0 5px 20px rgba(0,0,0,.07);
}

.grid{
    display:grid;
    grid-template-columns:repeat(auto-fit,minmax(220px,1fr));
    gap:10px;
}

.primary{
    background:#087f8c;
    color:white;
}

.danger{
    background:#d9534f;
    color:white;
}

.secondary{
    background:#e8f1f5;
    color:#183b56;
}

.patient{
    border:1px solid #dce8ee;
    border-radius:15px;
    padding:15px;
    margin-top:10px;
}

.patient h3{
    margin-top:0;
}

.actions{
    display:flex;
    gap:8px;
    flex-wrap:wrap;
    margin-top:10px;
}

.hidden{
    display:none;
}
</style>
</head>

<body>

<!-- LOGIN -->
<div id="loginPage">

    <div class="login-card">

        <div class="medical-logo">⚕️</div>

        <h1>Medicall</h1>
        <p>سیستم مدیریت پرونده بیماران</p>

        <input
            id="username"
            type="text"
            placeholder="نام کاربری"
            autocomplete="username"
        >

        <input
            id="password"
            type="password"
            placeholder="رمز عبور"
            autocomplete="current-password"
        >

        <button class="login-button" onclick="login()">
            ورود به سیستم
        </button>

        <p id="loginMessage"></p>

    </div>

</div>


<!-- MAIN -->
<div id="mainPage">

    <div class="header">
        <h1>⚕️ پرونده بیماران</h1>
        <p>مدیریت اطلاعات بیماران</p>

        <button class="danger" onclick="logout()">
            خروج
        </button>
    </div>


    <!-- ثبت بیمار -->
    <div class="card">

        <h2>➕ ثبت بیمار جدید</h2>

        <div class="grid">

            <input id="name" placeholder="نام و نام خانوادگی">

            <input id="nationalCode" placeholder="کد ملی">

            <input id="fatherName" placeholder="نام پدر">

            <input id="phone" placeholder="شماره تماس">

            <select id="mainInsurance">
                <option value="">نوع بیمه اصلی</option>
                <option>تأمین اجتماعی</option>
                <option>سلامت</option>
                <option>نیروهای مسلح</option>
                <option>آزاد</option>
                <option>سایر</option>
            </select>

            <input
                id="supplementaryInsurance"
                placeholder="بیمه تکمیلی"
            >

            <input
                id="supplementaryNumber"
                placeholder="شماره بیمه تکمیلی"
            >

        </div>

        <textarea
            id="address"
            placeholder="آدرس"
        ></textarea>

        <button class="primary" onclick="savePatient()">
            ذخیره بیمار
        </button>

        <button
            class="secondary"
            onclick="clearForm()"
        >
            پاک کردن
        </button>

    </div>


    <!-- جستجو -->
    <div class="card">

        <h2>🔎 جستجوی بیمار</h2>

        <input
            id="search"
            placeholder="نام، کد ملی یا شماره تماس..."
            oninput="showPatients()"
        >

        <div id="patientsList"></div>

    </div>


    <!-- پشتیبان -->
    <div class="card">

        <h2>💾 پشتیبان اطلاعات</h2>

        <p>
            برای انتقال اطلاعات به کامپیوتر، از اطلاعات خود فایل پشتیبان بگیرید.
        </p>

        <button class="primary" onclick="exportData()">
            دریافت فایل پشتیبان
        </button>

        <input
            type="file"
            id="importFile"
            accept=".json"
            onchange="importData(event)"
        >

    </div>

</div>


<script>

const STORAGE_KEY = "medicall_patients";

let patients = JSON.parse(
    localStorage.getItem(STORAGE_KEY) || "[]"
);

let editingId = null;


/* LOGIN */

function login(){

    const username =
        document.getElementById("username").value.trim();

    const password =
        document.getElementById("password").value;

    const message =
        document.getElementById("loginMessage");


    if(
        username === "drsadeghian" &&
        password === "586768"
    ){

        document.getElementById("loginPage").style.display =
            "none";

        document.getElementById("mainPage").style.display =
            "block";

        showPatients();

        message.textContent = "";

    }else{

        message.textContent =
            "نام کاربری یا رمز عبور اشتباه است.";

        message.style.color = "red";
    }
}


/* ENTER */

document.getElementById("password").addEventListener(
    "keydown",
    function(event){

        if(event.key === "Enter"){
            login();
        }

    }
);


/* LOGOUT */

function logout(){

    document.getElementById("mainPage").style.display =
        "none";

    document.getElementById("loginPage").style.display =
        "flex";

    document.getElementById("username").value = "";

    document.getElementById("password").value = "";
}


/* SAVE */

function savePatient(){

    const name =
        document.getElementById("name").value.trim();

    const nationalCode =
        document.getElementById("nationalCode").value.trim();

    if(!name){

        alert("لطفاً نام و نام خانوادگی را وارد کنید.");

        return;
    }


    if(editingId){

        const patient =
            patients.find(p => p.id === editingId);

        if(patient){

            patient.name =
                document.getElementById("name").value.trim();

            patient.nationalCode =
                document.getElementById("nationalCode").value.trim();

            patient.fatherName =
                document.getElementById("fatherName").value.trim();

            patient.address =
                document.getElementById("address").value.trim();

            patient.mainInsurance =
                document.getElementById("mainInsurance").value;

            patient.supplementaryInsurance =
                document.getElementById("supplementaryInsurance").value.trim();

            patient.supplementaryNumber =
                document.getElementById("supplementaryNumber").value.trim();

            patient.phone =
                document.getElementById("phone").value.trim();
        }

        editingId = null;

    }else{

        const patient = {

            id: Date.now(),

            name: name,

            nationalCode: nationalCode,

            fatherName:
                document.getElementById("fatherName").value.trim(),

            address:
                document.getElementById("address").value.trim(),

            mainInsurance:
                document.getElementById("mainInsurance").value,

            supplementaryInsurance:
                document.getElementById("supplementaryInsurance").value.trim(),

            supplementaryNumber:
                document.getElementById("supplementaryNumber").value.trim(),

            phone:
                document.getElementById("phone").value.trim()
        };


        patients.push(patient);
    }


    localStorage.setItem(
        STORAGE_KEY,
        JSON.stringify(patients)
    );

    clearForm();

    showPatients();

    alert("اطلاعات بیمار ذخیره شد.");
}


/* SHOW */

function showPatients(){

    const list =
        document.getElementById("patientsList");

    const search =
        document.getElementById("search").value
        .trim()
        .toLowerCase();


    const filtered =
        patients.filter(patient => {

            return (

                patient.name.toLowerCase().includes(search)

                ||

                patient.nationalCode
                    .toLowerCase()
                    .includes(search)

                ||

                patient.phone
                    .toLowerCase()
                    .includes(search)

            );

        });


    if(filtered.length === 0){

        list.innerHTML =
            "<p>هنوز بیماری ثبت نشده است.</p>";

        return;
    }


    list.innerHTML = filtered.map(patient => `

        <div class="patient">

            <h3>👤 ${escapeHTML(patient.name)}</h3>

            <p>
                <b>کد ملی:</b>
                ${escapeHTML(patient.nationalCode || "-")}
            </p>

            <p>
                <b>نام پدر:</b>
                ${escapeHTML(patient.fatherName || "-")}
            </p>

            <p>
                <b>شماره تماس:</b>
                ${escapeHTML(patient.phone || "-")}
            </p>

            <p>
                <b>بیمه:</b>
                ${escapeHTML(patient.mainInsurance || "-")}
            </p>

            <div class="actions">

                <button
                    class="primary"
                    onclick="editPatient(${patient.id})"
                >
                    ویرایش
                </button>

                <button
                    class="danger"
                    onclick="deletePatient(${patient.id})"
                >
                    حذف
                </button>

            </div>

        </div>

    `).join("");
}


/* EDIT */

function editPatient(id){

    const patient =
        patients.find(p => p.id === id);

    if(!patient) return;


    document.getElementById("name").value =
        patient.name || "";

    document.getElementById("nationalCode").value =
        patient.nationalCode || "";

    document.getElementById("fatherName").value =
        patient.fatherName || "";

    document.getElementById("address").value =
        patient.address || "";

    document.getElementById("mainInsurance").value =
        patient.mainInsurance || "";

    document.getElementById("supplementaryInsurance").value =
        patient.supplementaryInsurance || "";

    document.getElementById("supplementaryNumber").value =
        patient.supplementaryNumber || "";

    document.getElementById("phone").value =
        patient.phone || "";


    editingId = id;

    window.scrollTo({
        top:0,
        behavior:"smooth"
    });
}
