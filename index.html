<!DOCTYPE html>
<html lang="fa" dir="rtl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>پرونده پزشکی</title>

<style>
* {
    box-sizing: border-box;
}

body {
    margin: 0;
    font-family: Tahoma, Arial, sans-serif;
    background: #f3f6f9;
    color: #222;
}

.container {
    max-width: 900px;
    margin: auto;
    padding: 20px;
}

.card {
    background: white;
    padding: 22px;
    border-radius: 15px;
    margin-bottom: 20px;
    box-shadow: 0 3px 12px rgba(0,0,0,0.08);
}

h1, h2, h3 {
    margin-top: 0;
}

input, textarea, select {
    width: 100%;
    padding: 12px;
    margin: 7px 0 12px;
    border: 1px solid #ccc;
    border-radius: 8px;
    font-size: 15px;
}

textarea {
    min-height: 90px;
    resize: vertical;
}

button {
    border: none;
    padding: 11px 17px;
    border-radius: 8px;
    cursor: pointer;
    font-size: 15px;
    margin: 4px;
    background: #1976d2;
    color: white;
}

button:hover {
    opacity: 0.9;
}

.danger {
    background: #d32f2f;
}

.success {
    background: #2e7d32;
}

.gray {
    background: #666;
}

.patient {
    border: 1px solid #ddd;
    padding: 15px;
    border-radius: 10px;
    margin-top: 10px;
    background: #fafafa;
}

.history {
    border-right: 5px solid #1976d2;
    padding: 15px;
    margin: 12px 0;
    background: #f8fbff;
    border-radius: 8px;
}

.hidden {
    display: none;
}

.small {
    color: #666;
    font-size: 13px;
}
</style>
</head>

<body>

<div class="container">

<!-- LOGIN -->
<div id="loginPage" class="card">
    <h1>🔐 ورود به سیستم</h1>

    <label>نام کاربری</label>
    <input id="username" type="text">

    <label>رمز عبور</label>
    <input id="password" type="password">

    <button onclick="login()">ورود</button>

    <p id="loginError" style="color:red;"></p>
</div>


<!-- MAIN -->
<div id="mainPage" class="hidden">

    <div class="card">
        <h1>🏥 سیستم پرونده پزشکی</h1>

        <button onclick="showRegister()">➕ ثبت بیمار جدید</button>

        <button class="gray" onclick="logout()">خروج</button>
    </div>


    <!-- REGISTER / EDIT PATIENT -->
    <div id="patientForm" class="card hidden">

        <h2 id="formTitle">ثبت بیمار جدید</h2>

        <label>نام و نام خانوادگی</label>
        <input id="name">

        <label>کد ملی</label>
        <input id="nationalCode">

        <label>شماره پرونده</label>
        <input id="fileNumber">

        <label>نام پدر</label>
        <input id="fatherName">

        <label>آدرس</label>
        <textarea id="address"></textarea>

        <label>بیمه اصلی</label>
        <input id="mainInsurance">

        <label>بیمه تکمیلی</label>
        <input id="supplementaryInsurance">

        <label>شماره بیمه تکمیلی</label>
        <input id="supplementaryNumber">

        <label>شماره تماس</label>
        <input id="phone">

        <button id="savePatientButton" class="success" onclick="savePatient()">
            ثبت بیمار
        </button>

        <button class="gray" onclick="cancelForm()">
            انصراف
        </button>
    </div>


    <!-- SEARCH -->
    <div id="searchBox" class="card">

        <h2>🔎 جستجوی بیمار</h2>

        <input
            id="search"
            type="text"
            placeholder="نام، کد ملی یا شماره پرونده..."
            oninput="searchPatients()"
        >

        <div id="patientList"></div>
    </div>


    <!-- PATIENT PROFILE -->
    <div id="profilePage" class="card hidden">

        <button class="gray" onclick="backToPatients()">
            ← بازگشت
        </button>

        <h2>👤 پرونده بیمار</h2>

        <div id="profileInfo"></div>

        <hr>

        <h2>🩺 سوابق پزشکی</h2>

        <button onclick="showHistoryForm()" class="success">
            ➕ افزودن سابقه پزشکی
        </button>

        <!-- HISTORY FORM -->
        <div id="historyForm" class="hidden">

            <div class="card">

                <h3 id="historyTitle">ثبت سابقه جدید</h3>

                <label>تاریخ مراجعه</label>
                <input id="historyDate" type="date">

                <label>علت مراجعه</label>
                <textarea id="historyReason"></textarea>

                <label>تشخیص</label>
                <textarea id="historyDiagnosis"></textarea>

                <label>داروها / درمان</label>
                <textarea id="historyMedicine"></textarea>

                <label>توضیحات پزشک</label>
                <textarea id="historyNotes"></textarea>

                <button class="success" onclick="saveHistory()">
                    ذخیره سابقه
                </button>

                <button class="gray" onclick="cancelHistory()">
                    انصراف
                </button>

            </div>

        </div>

        <div id="historyList"></div>

        <hr>

        <button onclick="editCurrentPatient()">
            ✏️ ویرایش اطلاعات بیمار
        </button>

        <button class="danger" onclick="deleteCurrentPatient()">
            🗑 حذف بیمار
        </button>

    </div>

</div>

</div>


<script>

let patients = JSON.parse(localStorage.getItem("medicalPatients")) || [];

let currentPatientIndex = null;
let editingPatientIndex = null;
let editingHistoryIndex = null;


// LOGIN
function login() {

    const username = document.getElementById("username").value;
    const password = document.getElementById("password").value;

    if (username === "admin" && password === "1234") {

        document.getElementById("loginPage").classList.add("hidden");
        document.getElementById("mainPage").classList.remove("hidden");

        displayPatients();

    } else {

        document.getElementById("loginError").innerText =
            "نام کاربری یا رمز عبور اشتباه است.";

    }
}


// LOGOUT
function logout() {

    document.getElementById("mainPage").classList.add("hidden");
    document.getElementById("loginPage").classList.remove("hidden");

    document.getElementById("username").value = "";
    document.getElementById("password").value = "";
}


// SHOW REGISTER
function showRegister() {

    editingPatientIndex = null;

    document.getElementById("patientForm").classList.remove("hidden");

    document.getElementById("formTitle").innerText =
        "ثبت بیمار جدید";

    document.getElementById("savePatientButton").innerText =
        "ثبت بیمار";

    clearPatientForm();

    document.getElementById("profilePage").classList.add("hidden");
}


// CLEAR PATIENT FORM
function clearPatientForm() {

    document.getElementById("name").value = "";
    document.getElementById("nationalCode").value = "";
    document.getElementById("fileNumber").value = "";
    document.getElementById("fatherName").value = "";
    document.getElementById("address").value = "";
    document.getElementById("mainInsurance").value = "";
    document.getElementById("supplementaryInsurance").value = "";
    document.getElementById("supplementaryNumber").value = "";
    document.getElementById("phone").value = "";
}


// SAVE PATIENT
function savePatient() {

    const patient = {

        name: document.getElementById("name").value,
        nationalCode: document.getElementById("nationalCode").value,
        fileNumber: document.getElementById("fileNumber").value,
        fatherName: document.getElementById("fatherName").value,
        address: document.getElementById("address").value,
        mainInsurance: document.getElementById("mainInsurance").value,
        supplementaryInsurance: document.getElementById("supplementaryInsurance").value,
        supplementaryNumber: document.getElementById("supplementaryNumber").value,
        phone: document.getElementById("phone").value,

        history:
            editingPatientIndex !== null
            ? (patients[editingPatientIndex].history || [])
            : []

    };


    if (!patient.name.trim()) {

        alert("لطفاً نام بیمار را وارد کنید.");
        return;

    }


    if (editingPatientIndex !== null) {

        patients[editingPatientIndex] = patient;

        alert("اطلاعات بیمار ویرایش شد.");

    } else {

        patients.push(patient);

        alert("بیمار با موفقیت ثبت شد.");

    }


    localStorage.setItem(
        "medicalPatients",
        JSON.stringify(patients)
    );


    editingPatientIndex = null;

    document.getElementById("patientForm").classList.add("hidden");

    displayPatients();
}


// DISPLAY PATIENTS
function displayPatients(list = patients) {

    const container = document.getElementById("patientList");

    container.innerHTML = "";

    if (list.length === 0) {

        container.innerHTML =
            "<p>هنوز بیماری ثبت نشده است.</p>";

        return;

    }


    list.forEach((patient, index) => {

        const realIndex = patients.indexOf(patient);

        container.innerHTML += `

        <div class="patient">

            <h3>${escapeHTML(patient.name)}</h3>

            <p>
            کد ملی:
            ${escapeHTML(patient.nationalCode || "-")}
            </p>

            <p>
            شماره پرونده:
            ${escapeHTML(patient.fileNumber || "-")}
            </p>

            <button onclick="openProfile(${realIndex})">
                مشاهده پرونده
            </button>

        </div>

        `;

    });

}


// SEARCH
function searchPatients() {

    const text =
        document.getElementById("search").value
        .trim()
        .toLowerCase();


    if (!text) {

        displayPatients();
        return;

    }


    const results = patients.filter(patient =>

        (patient.name || "").toLowerCase().includes(text) ||

        (patient.nationalCode || "")
            .toLowerCase()
            .includes(text) ||

        (patient.fileNumber || "")
            .toLowerCase()
            .includes(text)

    );


    displayPatients(results);
}


// OPEN PROFILE
function openProfile(index) {

    currentPatientIndex = index;

    const patient = patients[index];

    document.getElementById("searchBox")
        .classList.add("hidden");

    document.getElementById("patientForm")
        .classList.add("hidden");

    document.getElementById("profilePage")
        .classList.remove("hidden");


    document.getElementById("profileInfo").innerHTML = `

        <p><strong>نام و نام خانوادگی:</strong>
        ${escapeHTML(patient.name)}</p>

        <p><strong>کد ملی:</strong>
        ${escapeHTML(patient.nationalCode || "-")}</p>

        <p><strong>شماره پرونده:</strong>
        ${escapeHTML(patient.fileNumber || "-")}</p>

        <p><strong>نام پدر:</strong>
        ${escapeHTML(patient.fatherName || "-")}</p>

        <p><strong>آدرس:</strong>
        ${escapeHTML(patient.address || "-")}</p>

        <p><strong>بیمه اصلی:</strong>
        ${escapeHTML(patient.mainInsurance || "-")}</p>

        <p><strong>بیمه تکمیلی:</strong>
        ${escapeHTML(patient.supplementaryInsurance || "-")}</p>

        <p><strong>شماره بیمه تکمیلی:</strong>
        ${escapeHTML(patient.supplementaryNumber || "-")}</p>

        <p><strong>شماره تماس:</strong>
        ${escapeHTML(patient.phone || "-")}</p>

    `;


    displayHistory();
}


// EDIT PATIENT
function editCurrentPatient() {

    const patient = patients[currentPatientIndex];

    editingPatientIndex = currentPatientIndex;


    document.getElementById("profilePage")
        .classList.add("hidden");

    document.getElementById("patientForm")
        .classList.remove("hidden");


    document.getElementById("formTitle").innerText =
        "ویرایش اطلاعات بیمار";

    document.getElementById("savePatientButton").innerText
